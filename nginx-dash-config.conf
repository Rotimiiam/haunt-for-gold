# Nginx configuration for Haunt For Gold Analytics Dashboard
# Domain: dash.rotimi.name.ng
# Analytics service runs on port 3002

# HTTPS server
server {
    server_name dash.rotimi.name.ng;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/dash-access.log;
    error_log /var/log/nginx/dash-error.log;

    # Max upload size
    client_max_body_size 10M;

    # Proxy settings for Analytics Node.js application
    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;

        # Headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache for 1 day (shorter than main app since analytics may update more frequently)
        expires 1d;
        add_header Cache-Control "public";

        # Security headers (repeated for cached content)
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # SSL configuration (will be managed by Certbot)
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    
    # Certbot will add these lines:
    # ssl_certificate /etc/letsencrypt/live/dash.rotimi.name.ng/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dash.rotimi.name.ng/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dash.rotimi.name.ng;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}
